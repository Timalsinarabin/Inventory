<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="inventory.png">
    <link rel="manifest" href="manifest.json">
    <title>Medicine Locator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-button {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-button:active {
            transform: scale(0.98);
        }

        .medicine-list {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .medicine-item {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .medicine-item:last-child {
            border-bottom: none;
        }

        .medicine-info {
            flex: 1;
        }

        .medicine-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            margin-bottom: 4px;
        }

        .medicine-location {
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }

        .medicine-location::before {
            content: "📍";
            margin-right: 6px;
        }

        .medicine-position {
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            padding-left: 22px;
        }

        .medicine-position::before {
            content: "📍";
            margin-right: 6px;
            opacity: 0;
        }

        .medicine-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-edit {
            background: #2196F3;
            color: white;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background: #4CAF50;
            color: white;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💊 Medicine Locator</h1>
            <p>Keep track of where your medicines are stored</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search for a medicine...">
        </div>

        <button class="add-button" onclick="openAddModal()">+ Add New Medicine</button>

        <div class="medicine-list" id="medicineList">
            <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <p>No medicines added yet.<br>Click "Add New Medicine" to get started!</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add Medicine</div>
            <form id="medicineForm">
                <div class="form-group">
                    <label for="medicineName">Medicine Name</label>
                    <input type="text" id="medicineName" required placeholder="e.g., Paracetamol">
                </div>
                <div class="form-group">
                    <label for="medicineShelf">Shelf/Location</label>
                    <input type="text" id="medicineShelf" required placeholder="e.g., Bathroom Cabinet">
                </div>
                <div class="form-group">
                    <label for="medicinePosition">Row & Column</label>
                    <input type="text" id="medicinePosition" required placeholder="e.g., R1 C1">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let medicines = [];
        let editingIndex = null;

        // Load medicines from localStorage on page load
        function loadMedicines() {
            const stored = localStorage.getItem('medicines');
            if (stored) {
                medicines = JSON.parse(stored);
                renderMedicines();
            }
        }

        // Save medicines to localStorage
        function saveMedicines() {
            localStorage.setItem('medicines', JSON.stringify(medicines));
        }

        // Render medicine list
        function renderMedicines(searchTerm = '') {
            const listEl = document.getElementById('medicineList');
            
            let filteredMedicines = medicines;
            if (searchTerm) {
                filteredMedicines = medicines.filter(med => 
                    med.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    med.shelf.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    med.position.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (filteredMedicines.length === 0) {
                if (searchTerm) {
                    listEl.innerHTML = '<div class="no-results">No medicines found matching "' + searchTerm + '"</div>';
                } else {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📦</div>
                            <p>No medicines added yet.<br>Click "Add New Medicine" to get started!</p>
                        </div>
                    `;
                }
                return;
            }

            listEl.innerHTML = filteredMedicines.map((med, index) => {
                const actualIndex = medicines.indexOf(med);
                return `
                    <div class="medicine-item">
                        <div class="medicine-info">
                            <div class="medicine-name">${med.name}</div>
                            <div class="medicine-location">${med.shelf}</div>
                            <div class="medicine-position">${med.position}</div>
                        </div>
                        <div class="medicine-actions">
                            <button class="btn btn-edit" onclick="editMedicine(${actualIndex})">Edit</button>
                            <button class="btn btn-delete" onclick="deleteMedicine(${actualIndex})">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Open add modal
        function openAddModal() {
            editingIndex = null;
            document.getElementById('modalTitle').textContent = 'Add Medicine';
            document.getElementById('medicineName').value = '';
            document.getElementById('medicineShelf').value = '';
            document.getElementById('medicinePosition').value = '';
            document.getElementById('modal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Edit medicine
        function editMedicine(index) {
            editingIndex = index;
            const med = medicines[index];
            document.getElementById('modalTitle').textContent = 'Edit Medicine';
            document.getElementById('medicineName').value = med.name;
            document.getElementById('medicineShelf').value = med.shelf;
            document.getElementById('medicinePosition').value = med.position;
            document.getElementById('modal').classList.add('active');
        }

        // Delete medicine
        function deleteMedicine(index) {
            if (confirm('Are you sure you want to delete this medicine?')) {
                medicines.splice(index, 1);
                saveMedicines();
                renderMedicines();
            }
        }

        // Form submit
        document.getElementById('medicineForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('medicineName').value.trim();
            const shelf = document.getElementById('medicineShelf').value.trim();
            const position = document.getElementById('medicinePosition').value.trim();

            if (editingIndex !== null) {
                medicines[editingIndex] = { name, shelf, position };
            } else {
                medicines.push({ name, shelf, position });
            }

            saveMedicines();
            renderMedicines();
            closeModal();
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            renderMedicines(e.target.value);
        });

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Load medicines on page load
        loadMedicines();
    </script>
</body>
</html>
